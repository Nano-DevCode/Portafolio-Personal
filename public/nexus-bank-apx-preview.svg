<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326" />
      <stop offset="50%" stop-color="#0a1d3b" />
      <stop offset="100%" stop-color="#061020" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f274a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#091931" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect x="30" y="30" width="1140" height="615" rx="20" fill="#08162b" stroke="#1e3a6d" stroke-width="2" />

  <!-- Top Bar -->
  <rect x="30" y="30" width="1140" height="72" rx="20" fill="#0d2242" />
  <circle cx="68" cy="66" r="8" fill="#ef4444" />
  <circle cx="92" cy="66" r="8" fill="#f59e0b" />
  <circle cx="116" cy="66" r="8" fill="#10b981" />
  <text x="150" y="72" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    NexusBank APX + ASO Core — Simulador Transaccional Bancario
  </text>
  <rect x="890" y="48" width="250" height="36" rx="18" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
  <text x="1015" y="71" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#38bdf8">
    Java 25 • Spring Boot 4.1
  </text>

  <!-- Architecture Layers Row -->
  <!-- Layer 1: ASO -->
  <rect x="65" y="135" width="250" height="295" rx="14" fill="url(#cardBg)" stroke="#0284c7" stroke-width="2" />
  <rect x="85" y="155" width="90" height="26" rx="6" fill="#0284c7" />
  <text x="130" y="173" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#ffffff">CAPA ASO</text>
  <text x="85" y="208" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Exposición REST &amp; XML</text>
  <text x="85" y="232" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">com.nexus.bbva.aso</text>
  <text x="85" y="265" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• POST /aso/v1/transfers/spei</text>
  <text x="85" y="290" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• GET /cep/{key} (Banxico XML)</text>
  <text x="85" y="315" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• POST /batch/control-m</text>
  <text x="85" y="340" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Java Record + @Valid (ASO400)</text>
  <text x="85" y="365" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Headers X-APX-* Telemetría</text>
  <text x="85" y="400" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">Sin acceso directo a JDBC/Libs</text>

  <!-- Arrow 1 -->
  <path d="M 320 280 L 348 280" stroke="#38bdf8" stroke-width="3" />
  <polygon points="348,274 360,280 348,286" fill="#38bdf8" />

  <!-- Layer 2: AOP & Context -->
  <rect x="365" y="135" width="250" height="295" rx="14" fill="url(#cardBg)" stroke="#6366f1" stroke-width="2" />
  <rect x="385" y="155" width="115" height="26" rx="6" fill="#6366f1" />
  <text x="442" y="173" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#ffffff">APX CONTEXT</text>
  <text x="385" y="208" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Motor AOP &amp; Advices</text>
  <text x="385" y="232" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">com.nexus.bbva.apx.context</text>
  <text x="385" y="265" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• AbstractApxElement Base</text>
  <text x="385" y="290" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• ThreadLocal&lt;List&lt;Advice&gt;&gt;</text>
  <text x="385" y="315" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• ApxExecutionAspect (@Around)</text>
  <text x="385" y="340" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Rollback automático por Advice</text>
  <text x="385" y="365" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Enmascaramiento PII en logs</text>
  <text x="385" y="400" font-family="Consolas, monospace" font-size="12" fill="#818cf8">Auditoría de latencia Trx/Lib</text>

  <!-- Arrow 2 -->
  <path d="M 620 280 L 648 280" stroke="#818cf8" stroke-width="3" />
  <polygon points="648,274 660,280 648,286" fill="#818cf8" />

  <!-- Layer 3: APX TRX -->
  <rect x="665" y="135" width="230" height="295" rx="14" fill="url(#cardBg)" stroke="#10b981" stroke-width="2" />
  <rect x="685" y="155" width="95" height="26" rx="6" fill="#10b981" />
  <text x="732" y="173" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#06281e">APX TRX</text>
  <text x="685" y="208" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Transacciones APX</text>
  <text x="685" y="232" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">com.nexus.bbva.apx.trx</text>
  <text x="685" y="265" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• SpeiTransferTrx</text>
  <text x="685" y="290" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• AccountQueryTrx</text>
  <text x="685" y="315" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• NightlyBatchTrx</text>
  <text x="685" y="340" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• @Transactional ACID</text>
  <text x="685" y="365" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Inyección por Interfaz</text>
  <text x="685" y="400" font-family="Consolas, monospace" font-size="12" fill="#34d399">Orquestación de Negocio</text>

  <!-- Arrow 3 -->
  <path d="M 900 280 L 923 280" stroke="#34d399" stroke-width="3" />
  <polygon points="923,274 935,280 923,286" fill="#34d399" />

  <!-- Layer 4: APX LIB & DB -->
  <rect x="940" y="135" width="200" height="295" rx="14" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="2" />
  <rect x="960" y="155" width="95" height="26" rx="6" fill="#f59e0b" />
  <text x="1007" y="173" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1e1b18">APX LIB</text>
  <text x="960" y="208" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Librerías &amp; SQL</text>
  <text x="960" y="232" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">...apx.lib.impl</text>
  <text x="960" y="265" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• AccountLibImpl</text>
  <text x="960" y="290" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• SELECT FOR UPDATE</text>
  <text x="960" y="315" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Idempotency-Key</text>
  <text x="960" y="340" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• KafkaEventLibImpl</text>
  <text x="960" y="365" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• H2 (Modo Oracle)</text>
  <text x="960" y="400" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">JdbcTemplate (jdbcUtils)</text>

  <!-- Bottom Metrics & Governance Bar -->
  <rect x="65" y="465" width="1075" height="145" rx="14" fill="#0b1d36" stroke="#1e3a6d" stroke-width="1.5" />

  <text x="95" y="502" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
    GOBIERNO ARQUITECTÓNICO, SEGURIDAD BANCARIA &amp; CI/CD EMPRESARIAL
  </text>

  <!-- 4 Pillars in Bottom Bar -->
  <rect x="95" y="520" width="245" height="68" rx="10" fill="#081528" stroke="#1e3a6d" />
  <text x="112" y="546" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#10b981">27 Tests JUnit 5 + JaCoCo</text>
  <text x="112" y="570" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94a3b8">Pruebas de gobierno por reflexión</text>

  <rect x="358" y="520" width="245" height="68" rx="10" fill="#081528" stroke="#1e3a6d" />
  <text x="375" y="546" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#38bdf8">Bloqueo FOR UPDATE</text>
  <text x="375" y="570" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94a3b8">Prevención de doble gasto e idempotencia</text>

  <rect x="621" y="520" width="245" height="68" rx="10" fill="#081528" stroke="#1e3a6d" />
  <text x="638" y="546" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#818cf8">CEP Banxico XML &amp; Kafka</text>
  <text x="638" y="570" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94a3b8">Eventos SPEI con PII enmascarado</text>

  <rect x="884" y="520" width="230" height="68" rx="10" fill="#081528" stroke="#1e3a6d" />
  <text x="901" y="546" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#fbbf24">Jenkins + OpenShift</text>
  <text x="901" y="570" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#94a3b8">SonarQube Gate + Docker ZGC</text>
</svg>
