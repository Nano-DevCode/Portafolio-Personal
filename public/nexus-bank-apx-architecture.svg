<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)" />
  <rect x="30" y="30" width="1140" height="615" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

  <text x="70" y="82" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    Flujo Transaccional SPEI, Manejo de Errores (Advices) y Pipeline DevSecOps
  </text>
  <text x="70" y="110" font-family="Consolas, monospace" font-size="14" fill="#38bdf8">
    POST /aso/v1/transfers/spei • SELECT ... FOR UPDATE • Rollback Automático ante Advices BBE001–BBE006
  </text>

  <!-- Left Panel: Sequence Flow -->
  <rect x="65" y="135" width="530" height="475" rx="14" fill="#09101f" stroke="#1e293b" stroke-width="1.5" />
  <text x="90" y="172" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">
    1. Ciclo de Vida de Transacción y Rollback APX
  </text>

  <rect x="90" y="195" width="480" height="58" rx="8" fill="#111c33" stroke="#0284c7" />
  <text x="108" y="220" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#38bdf8">Paso 1 • AsoSpeiController (@Valid SpeiRequestRecord)</text>
  <text x="108" y="240" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Valida esquema de entrada (ASO400) y delega a SpeiTransferTrx.</text>

  <rect x="90" y="268" width="480" height="58" rx="8" fill="#111c33" stroke="#6366f1" />
  <text x="108" y="293" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#818cf8">Paso 2 • ApxExecutionAspect (@Around AOP)</text>
  <text x="108" y="313" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Limpia ThreadLocal Advices, enmascara PII (****0011) e inicia cronómetro.</text>

  <rect x="90" y="341" width="480" height="58" rx="8" fill="#111c33" stroke="#f59e0b" />
  <text x="108" y="366" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#fbbf24">Paso 3 • AccountLibImpl (JdbcTemplate + FOR UPDATE)</text>
  <text x="108" y="386" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Verifica Idempotency-Key y bloquea fila de cuenta origen en BD.</text>

  <rect x="90" y="414" width="480" height="58" rx="8" fill="#111c33" stroke="#ef4444" />
  <text x="108" y="439" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#f87171">Paso 4A • Si hay Advice (BBE001–BBE006)</text>
  <text x="108" y="459" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Dispara ApxRollbackException (Rollback SQL) y responde HTTP 422.</text>

  <rect x="90" y="487" width="480" height="58" rx="8" fill="#111c33" stroke="#10b981" />
  <text x="108" y="512" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#34d399">Paso 4B • Sin Advices (Transacción Exitosa)</text>
  <text x="108" y="532" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Commit en BD, genera clave BBVA*, publica en Kafka y responde 200 OK.</text>

  <text x="90" y="585" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">
    Headers: X-APX-Transaction | X-APX-Library | X-APX-Elapsed-Ms | X-APX-Thread
  </text>

  <!-- Right Panel: Error Catalog & DevSecOps -->
  <rect x="620" y="135" width="515" height="235" rx="14" fill="#09101f" stroke="#1e293b" stroke-width="1.5" />
  <text x="645" y="172" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fbbf24">
    2. Catálogo Bancario de Errores y Advices
  </text>
  <text x="645" y="205" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">• ASO400 (HTTP 400): Error de validación en SpeiRequestRecord</text>
  <text x="645" y="233" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">• BBE001 (HTTP 422): Monto de transferencia nulo o menor/igual a 0</text>
  <text x="645" y="261" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">• BBE002 (HTTP 422): Cuenta origen inexistente en base de datos</text>
  <text x="645" y="289" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">• BBE003 (HTTP 422): Fondos insuficientes (Rollback automático)</text>
  <text x="645" y="317" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">• BBE004 (HTTP 422): Cuenta destino inexistente (Rollback automático)</text>
  <text x="645" y="345" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">• BBE006 (HTTP 422): Operación duplicada por X-Idempotency-Key</text>

  <rect x="620" y="390" width="515" height="220" rx="14" fill="#09101f" stroke="#1e293b" stroke-width="1.5" />
  <text x="645" y="427" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#10b981">
    3. Operaciones Bancarias &amp; Pipeline CI/CD
  </text>
  <text x="645" y="460" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Comprobante Electrónico de Pago (CEP Banxico) exportable en XML</text>
  <text x="645" y="488" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Batch Nocturno Control-M (NightlyBatchTrx) para cálculo de intereses</text>
  <text x="645" y="516" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Publicación de eventos en tópico bbva.ether.spei.movements.v1</text>
  <text x="645" y="544" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Jenkinsfile con JUnit 5, cobertura JaCoCo y Quality Gate en SonarQube</text>
  <text x="645" y="572" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#cbd5e1">• Despliegue en Red Hat OpenShift + Contenedor Alpine JRE 25 non-root</text>
</svg>
